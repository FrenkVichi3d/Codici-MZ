<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Codici MZ Robotics</title>

    <!-- LIBRERIA FONDAMENTALE: Office.js permette di parlare con Excel -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-robot"></i>
                <h1>Codici MZ</h1>
                <button id="syncBtn" class="icon-btn" title="Rileggi Foglio Excel"
                    style="margin-left: 10px; font-size: 1.5rem; color: var(--primary);">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
            <p style="font-size: 0.9rem;">Seleziona i parametri coerenti con il componente</p>
        </header>

        <!-- Div di caricamento iniziale -->
        <div id="loadingOverlay" style="text-align: center; margin-top: 50px;">
            <i class="fa-solid fa-circle-notch fa-spin fa-3x" style="color: var(--primary);"></i>
            <p style="margin-top: 15px; font-weight: 600;">Sincronizzazione con Excel...</p>
            <p style="font-size: 0.8rem; color: var(--text-muted); padding: 0 20px;">
                Assicurati di aprire il componente all'interno di Excel.
            </p>
        </div>

        <main id="appMain" style="display: none;">

            <!-- BARRA DI RICERCA GLOBALE -->
            <div class="card search-container" style="margin-bottom: 1.25rem;">
                <div style="position: relative; display: flex; align-items: center;">
                    <i class="fa-solid fa-search" style="position: absolute; left: 1rem; color: var(--text-muted);"></i>
                    <input type="text" id="globalSearchInput" placeholder="Cerca componente (es. LAM SP4)..."
                        style="padding-left: 2.5rem; padding-right: 2.5rem; width: 100%; border-radius: 9999px;"
                        autocomplete="off">
                    <button id="clearSearchBtn"
                        style="position: absolute; right: 1rem; background: none; border: none; cursor: pointer; color: var(--text-muted); display: none; font-size: 1.1rem;">
                        <i class="fa-solid fa-times-circle"></i>
                    </button>
                </div>
                <div id="searchResultsContainer"
                    style="display: none; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px;">
                    <p id="searchCount"
                        style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">
                    </p>
                    <ul id="searchResultsList" class="history-list" style="max-height: 250px; overflow-y: auto;">
                    </ul>
                </div>
            </div>

            <div class="card form-container">
                <!-- PRESET RAPIDI / PREFERITI -->
                <div class="presets-section">
                    <div class="presets-header">
                        <span class="presets-title"><i class="fa-solid fa-bolt"></i> Scorciatoie Rapide</span>
                        <button id="addPresetBtn" type="button" class="preset-add-btn" title="Salva la combinazione attualmente selezionata come scorciatoia">
                            <i class="fa-solid fa-star"></i> Salva Preferito
                        </button>
                    </div>

                    <!-- Input inline per nominare il preferito senza prompt() bloccato da Excel -->
                    <div id="presetAddBox" class="preset-add-box" style="display: none;">
                        <input type="text" id="presetNameInput" placeholder="Nome scorciatoia..." maxlength="30" autocomplete="off">
                        <button id="presetConfirmBtn" type="button" class="btn-preset-confirm" title="Conferma salvataggio"><i class="fa-solid fa-check"></i></button>
                        <button id="presetCancelBtn" type="button" class="btn-preset-cancel" title="Annulla"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div id="presetErrorMsg" class="preset-error-msg" style="display: none;"></div>

                    <div id="presetsList" class="presets-list">
                        <!-- Generati dinamicamente da app.js -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="sheetSelect">Categoria Principale</label>
                    <div class="select-wrapper">
                        <select id="sheetSelect">
                            <option value="">Caricamento...</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="level1Select">Livello 1 (Tipologia)</label>
                    <div class="select-wrapper">
                        <select id="level1Select" disabled>
                            <option value="">Seleziona Categoria Principale prima...</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="level2Select">Livello 2 (Dettaglio)</label>
                    <div class="select-wrapper">
                        <select id="level2Select" disabled>
                            <option value="">Seleziona Livello 1 prima...</option>
                        </select>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="progressiveInput">Progressivo (4 Cifre)</label>
                    <input type="number" id="progressiveInput" min="1" max="9999" value="1" placeholder="0001">
                </div>

                <div class="form-group" style="margin-bottom: 0.75rem;">
                    <label for="descriptionInput">Descrizione</label>
                    <input type="text" id="descriptionInput" placeholder="Inserisci la descrizione" autocomplete="off">
                </div>

                <!-- SUGGERIMENTO INTELLIGENTE DALLA DESCRIZIONE -->
                <div id="smartSuggestionCard" class="smart-suggestion-card" style="display: none;">
                    <div class="smart-suggestion-header">
                        <div class="smart-suggestion-badge">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Suggerimento Automatico
                        </div>
                        <button id="dismissSuggestionBtn" type="button" class="suggestion-dismiss" title="Chiudi suggerimento">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div id="smartSuggestionPath" class="smart-suggestion-path">
                        <!-- Es: 5 SEMILAVORATO › 01 ACCIAIO › 01 CARPENTERIA -->
                    </div>
                    <div class="smart-suggestion-footer">
                        <span id="smartSuggestionReason" class="smart-suggestion-reason">
                            <!-- Es: Trovato in componenti simili -->
                        </span>
                        <button id="applySuggestionBtn" type="button" class="btn-suggestion">
                            <i class="fa-solid fa-check"></i> Applica
                        </button>
                    </div>
                </div>

                <button id="generateBtn" class="btn-primary" style="margin-top: 1rem;">
                    <i class="fa-solid fa-plus-circle"></i> Genera e Inserisci in Excel
                </button>
            </div>

            <div class="card result-container" id="resultCard" style="display: none;">
                <div class="success-badge"><i class="fa-solid fa-check-circle"></i> Codice Inserito</div>
                <h2 style="font-size: 1.1rem; margin-top: 10px;">Dettaglio Codice</h2>
                <div class="code-display" style="font-size: 1.2rem;">
                    <span id="finalCode"></span>
                    <button id="copyBtn" class="icon-btn" title="Copia negli appunti">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
                <div class="code-breakdown" id="codeBreakdown">
                    <!-- Breakdown of the code will be injected here -->
                </div>
            </div>

            <div class="card history-container">
                <div class="history-header">
                    <h2 style="font-size: 1.1rem;">Storico Sessione</h2>
                    <button id="clearHistoryBtn" class="text-btn text-danger">Svuota</button>
                </div>
                <ul id="historyList" class="history-list">
                    <li class="empty-state">Nessun codice generato in questa sessione.</li>
                </ul>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>

</html>
